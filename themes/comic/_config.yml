# Comic Style Theme Configuration
# -------------------------------

# Navigation menu
menu:
  首页: /
  分类: /categories
  标签: /tags
  归档: /archives

# Hero section (homepage)
hero:
  enable: true
  # 留空则不显示徽章
  badge:
  # 留空则使用站点 title
  title:
  # 留空则使用站点 description
  description:
  # 留空则使用站点 subtitle（subtitle 未配置时不显示引言气泡）
  quote:
  buttons:
    - text: 归档
      url: /archives

# Homepage section title
index:
  section_title: 最新文章
  full_catalog_url: /archives
  show_category: true
  show_tags: true

# Footer
footer:
  copyright: '2026'
  description:

# Post meta display
post_meta:
  show_date: true
  show_author: true
  show_categories: true
  show_tags: true

# Tags page
tags:
  description:

# Categories page
categories:
  description:

# Archives page
archives:
  description: